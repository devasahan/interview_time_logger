{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Pages">
    {% if page_obj.has_previous %}<a class="btn btn-sm" href="{% querystring page=page_obj.previous_page_number %}">‹ Newer</a>{% endif %}
    <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-sm" href="{% querystring page=page_obj.next_page_number %}">Older ›</a>{% endif %}
  </nav>
{% endif %}
